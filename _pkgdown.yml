url: https://Shrabanti87.github.io/PageDL/

template:
  bootstrap: 5
  bootswatch: flatly
  bslib:
    primary: "#1f6f4a"

home:
  title: PageDL
  description: Pathway-guided ensemble prediction from bulk or cell-type-specific molecular data.
  sidebar:
    structure: [links, license, citation, authors, dev]

navbar:
  structure:
    left: [home, intro, demo, reference, articles]
    right: [github]
  components:
    home:
      text: Home
      href: index.html
    intro:
      text: Tutorial
      href: articles/pagedl-tutorial.html
    demo:
      text: Demo
      href: articles/pagedl-portal.html
    reference:
      text: Reference
      href: reference/index.html
    articles:
      text: Articles
      menu:
      - text: Portal and Shiny demo
        href: articles/pagedl-portal.html
      - text: PageDL tutorial
        href: articles/pagedl-tutorial.html
    github:
      icon: fa-github
      href: https://github.com/Shrabanti87/PageDL
      aria-label: GitHub

reference:
- title: Package and demo
  contents:
  - PageDL-package
  - pagedl_model_info
  - launch_pagedl_demo
- title: Pathway and gene selection
  contents:
  - pathway_select
  - gene_select
  - llm_literature_signatures
- title: Performance evaluation
  contents:
  - Train_perform_CV
  - Test_perform
  - Gene_Train_perform_CV
  - Gene_Test_perform
- title: Plotting
  contents:
  - plot_pathway_selection
  - plot_gene_selection
